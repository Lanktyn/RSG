<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlane</title>
<style>
:root{color-scheme:dark;--bg:#05060f;--ink:#eef2ff;--dim:#9aa6c8;--amber:#ffb86b;--cyan:#8fd3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);text-align:center;font-size:clamp(44px,9vw,76px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber);text-shadow:0 0 24px rgba(255,184,107,.45);pointer-events:none}
#snd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
#panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(5,6,15,.35),rgba(5,6,15,.8))}
#panel.hide{display:none}
h1{margin:0;font-size:clamp(48px,12vw,96px);letter-spacing:.02em;font-weight:700;color:var(--cyan);text-shadow:0 0 30px rgba(143,211,255,.4)}
#msg{margin:0;max-width:30ch;font-size:18px;line-height:1.5;color:var(--dim)}
#best{margin:0;color:var(--amber);font-size:16px;min-height:1.2em}
#go{margin-top:6px;background:var(--amber);color:#1a1006;border:0;border-radius:28px;padding:14px 38px;font:inherit;font-size:19px;font-weight:700;cursor:pointer}
#go:focus-visible,#snd:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
</style></head><body>
<div id="hud">0</div>
<button id="snd" aria-label="Toggle sound">Sound on</button>
<div id="panel"><h1 id="ttl">Starlane</h1><p id="msg">Steer with your cursor or finger. Slip past every asteroid.</p><p id="best"></p><button id="go">Launch</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060f);scene.fog=new THREE.Fog(0x05060f,70,175);
const cam=new THREE.PerspectiveCamera(60,1,.1,400);
scene.add(new THREE.HemisphereLight(0x8fa8ff,0x2a1530,.75));
const sun=new THREE.DirectionalLight(0xffe2c0,1.5);sun.position.set(-4,6,5);scene.add(sun);

// Space backdrop: stars + nebula glows
const SN=1500,sp=new Float32Array(SN*3),sc=new Float32Array(SN*3);
for(let i=0;i<SN;i++){sp.set([R(-130,130),R(-90,90),R(-175,20)],i*3);const c=new THREE.Color().setHSL(R(.5,.72),.4,R(.6,1));sc.set([c.r,c.g,c.b],i*3);}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:1.8,sizeAttenuation:false,vertexColors:true,fog:false})));
function glow(c1){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,c1);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
[['rgba(120,80,220,.55)',-60,25,-165,170],['rgba(40,160,200,.4)',70,-30,-170,190],['rgba(220,90,140,.3)',10,50,-175,150]].forEach(([c,x,y,z,s])=>{const o=new THREE.Sprite(new THREE.SpriteMaterial({map:glow(c),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));o.position.set(x,y,z);o.scale.set(s,s,1);scene.add(o);});

// Rocket ship (nose points to -z)
const ship=new THREE.Group(),body=new THREE.Group();ship.add(body);body.rotation.x=-Math.PI/2;scene.add(ship);
const hullM=new THREE.MeshStandardMaterial({color:0xe8ecf7,metalness:.5,roughness:.35}),redM=new THREE.MeshStandardMaterial({color:0xff6a5c,metalness:.3,roughness:.4});
const part=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);body.add(o);return o;};
part(new THREE.CylinderGeometry(.3,.38,1.4,20),hullM,0,0,0);
part(new THREE.ConeGeometry(.3,.9,20),redM,0,1.15,0);
part(new THREE.SphereGeometry(.16,12,12),new THREE.MeshStandardMaterial({color:0x8fd3ff,emissive:0x3a7fb0,roughness:.1}),0,.35,.28);
part(new THREE.CylinderGeometry(.2,.28,.25,16),new THREE.MeshStandardMaterial({color:0x333a4d,metalness:.8,roughness:.4}),0,-.78,0);
for(let i=0;i<3;i++){const p=new THREE.Group();p.rotation.y=i*Math.PI*2/3;const f=new THREE.Mesh(new THREE.BoxGeometry(.55,.6,.07),redM);f.position.set(.5,-.5,0);p.add(f);body.add(p);}
const flame=part(new THREE.ConeGeometry(.2,1,12),new THREE.MeshBasicMaterial({color:0xffb86b,transparent:true,opacity:.85}),0,-1.35,0);flame.rotation.x=Math.PI;

// Asteroids: every one gets its own noise-warped, randomly scaled and coloured shape
const BASES=[()=>new THREE.IcosahedronGeometry(1,2),()=>new THREE.DodecahedronGeometry(1,1),()=>new THREE.OctahedronGeometry(1,2),()=>new THREE.IcosahedronGeometry(1,1),()=>new THREE.TetrahedronGeometry(1,3)];
const rocks=[];
function makeRock(){
 const g=BASES[Math.random()*BASES.length|0](),p=g.attributes.position,v=new THREE.Vector3();
 const k=[0,1,2].map(()=>[R(.6,2.2),R(0,6.28)]),amp=R(.12,.42),sx=R(.65,1.35),sy=R(.65,1.35),sz=R(.65,1.35);
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).normalize();
  const n=Math.sin(v.x*k[0][0]*3+k[0][1])*Math.sin(v.y*k[1][0]*3+k[1][1])+.5*Math.sin(v.z*k[2][0]*4+k[2][1]);
  v.multiplyScalar(1+amp*n);v.x*=sx;v.y*=sy;v.z*=sz;p.setXYZ(i,v.x,v.y,v.z);}
 g.computeVertexNormals();
 const t=Math.random();let col,rough=.9,em=0x000000;
 if(t<.5)col=new THREE.Color().setHSL(R(.05,.12),R(.1,.35),R(.25,.45));
 else if(t<.7)col=new THREE.Color().setHSL(R(.0,.04),R(.45,.65),R(.28,.4));
 else if(t<.88){col=new THREE.Color().setHSL(R(.54,.6),R(.3,.6),R(.6,.78));rough=.25;em=0x10283c;}
 else col=new THREE.Color().setHSL(R(.7,.8),R(.15,.3),R(.15,.25));
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,flatShading:true,roughness:rough,metalness:.08,emissive:em}));
 const size=R(.8,2.6);m.scale.setScalar(size);
 m.userData={hit:size*.8*(sx+sy+sz)/3,spin:new THREE.Vector3(R(-1,1),R(-1,1),R(-1,1)),scored:false};
 m.rotation.set(R(0,6),R(0,6),R(0,6));return m;
}
function killRock(m){scene.remove(m);m.geometry.dispose();m.material.dispose();}

// Explosion
const bits=[],bitG=new THREE.IcosahedronGeometry(.12,0);
function boom(){for(let i=0;i<30;i++){const m=new THREE.Mesh(bitG,new THREE.MeshBasicMaterial({color:i%3?0xffb86b:0xffffff,transparent:true}));m.position.copy(ship.position);m.userData={v:new THREE.Vector3(R(-1,1),R(-1,1),R(-1,1)).normalize().multiplyScalar(R(2,9)),life:1.2};scene.add(m);bits.push(m);}}

// Sizing
let PW=4,PH=4;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;const t=Math.tan(cam.fov*Math.PI/360),d=Math.max(7,4.2/(t*cam.aspect));cam.position.set(0,0,d);cam.updateProjectionMatrix();PH=t*d*.82;PW=t*d*cam.aspect*.86;}
addEventListener('resize',resize);resize();

// Input (mouse, pen and touch via pointer events)
let nx=0,ny=0;
function setP(e){nx=e.clientX/innerWidth*2-1;ny=-(e.clientY/innerHeight*2-1);if(e.pointerType==='touch')ny+=.14;}
addEventListener('pointermove',setP);addEventListener('pointerdown',setP);

// Audio: calm pad + soft bells, plus sfx
let AC,master,music,sfx,lp,muted=false;
function noise(d){const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;return s;}
function pad(fs,t,dur){fs.forEach(f=>[-5,5].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.detune.value=dt;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur*1.1);o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur*1.2);}));}
function bell(){if(!AC)return;const f=[440,523.25,587.33,659.25,783.99,880][Math.random()*6|0],t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+3);o.connect(g);g.connect(music);o.start(t);o.stop(t+3.2);setTimeout(bell,R(2000,4500));}
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
 music=AC.createGain();music.gain.value=.3;music.connect(master);
 sfx=AC.createGain();sfx.gain.value=.8;sfx.connect(master);
 lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(music);
 const dl=AC.createDelay(1);dl.delayTime.value=.5;const fb=AC.createGain();fb.gain.value=.4;music.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);
 const CH=[[110,220,261.63,329.63],[87.31,174.61,220,261.63],[130.81,196,261.63,329.63],[98,196,246.94,293.66]];let ci=0;
 const bar=()=>pad(CH[ci++%4],AC.currentTime+.05,8);bar();setInterval(bar,8000);setTimeout(bell,2500);
}
const PENT=[523.25,587.33,659.25,783.99,880];
function ping(n){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=PENT[n%5];o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+.08);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(sfx);o.start(t);o.stop(t+.4);}
function crash(){if(!AC)return;const t=AC.currentTime,n=noise(1),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(70,t+.9);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.95);n.connect(f);f.connect(g);g.connect(sfx);n.start(t);
 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(30,t+.6);og.gain.setValueAtTime(.6,t);og.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(og);og.connect(sfx);o.start(t);o.stop(t+.8);}
function whoosh(){if(!AC)return;const t=AC.currentTime,n=noise(.8),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(1800,t+.6);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+.75);n.connect(f);f.connect(g);g.connect(sfx);n.start(t);}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'Sound off':'Sound on';if(master)master.gain.value=muted?0:1;};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume();});

// Game
let state='menu',score=0,speed=24,spawnT=0,shake=0,best=0;
try{best=+localStorage.getItem('starlane-best')||0;}catch(e){}
function setBest(){$('best').textContent=best?'Best: '+best:'';}setBest();
function start(){initAudio();whoosh();rocks.splice(0).forEach(killRock);score=0;speed=24;spawnT=.6;$('hud').textContent='0';ship.visible=true;state='play';$('panel').classList.add('hide');}
function lose(){state='over';shake=.6;ship.visible=false;boom();crash();
 if(score>best){best=score;try{localStorage.setItem('starlane-best',best);}catch(e){}}
 setTimeout(()=>{$('ttl').textContent='Hull breached';$('msg').textContent='You slipped past '+score+(score===1?' asteroid.':' asteroids.');setBest();$('go').textContent='Fly again';$('panel').classList.remove('hide');},800);}
$('go').onclick=start;

let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
 const play=state==='play',sp2=play?speed:(state==='over'?6:10);
 const a=sg.attributes.position.array;for(let i=0;i<SN;i++){a[i*3+2]+=sp2*.5*dt;if(a[i*3+2]>20)a[i*3+2]=-175;}sg.attributes.position.needsUpdate=true;
 const tx=clamp(nx,-1,1)*PW,ty=clamp(ny,-1,1)*PH;
 if(state!=='over'){const k=Math.min(1,dt*9),dx=tx-ship.position.x,dy=ty-ship.position.y;ship.position.x+=dx*k;ship.position.y+=dy*k;
  ship.rotation.z=clamp(-dx*.12,-.7,.7);ship.rotation.x=clamp(dy*.08,-.5,.5);ship.rotation.y=clamp(-dx*.05,-.4,.4);}
 flame.scale.set(1,R(.8,1.3),1);flame.material.opacity=R(.65,.95);
 if(play){speed=24+Math.min(score*.8,34);spawnT-=dt;
  if(spawnT<=0){spawnT=Math.max(.28,.85-score*.012);const r=makeRock(),near=Math.random()<.4;
   r.position.set(near?tx+R(-2,2):R(-1,1)*(PW+2),near?ty+R(-2,2):R(-1,1)*(PH+2),-150);scene.add(r);rocks.push(r);}}
 for(let i=rocks.length-1;i>=0;i--){const r=rocks[i],u=r.userData;r.position.z+=sp2*dt;r.rotation.x+=u.spin.x*dt;r.rotation.y+=u.spin.y*dt;r.rotation.z+=u.spin.z*dt;
  if(play){if(r.position.distanceTo(ship.position)<u.hit+.5){lose();}
   else if(!u.scored&&r.position.z>1.5){u.scored=true;score++;$('hud').textContent=score;$('hud').animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:180});ping(score);}}
  if(r.position.z>cam.position.z+3){killRock(r);rocks.splice(i,1);}}
 for(let i=bits.length-1;i>=0;i--){const b=bits[i],u=b.userData;u.life-=dt;b.position.addScaledVector(u.v,dt);b.material.opacity=Math.max(0,u.life/1.2);b.scale.setScalar(Math.max(.01,u.life));
  if(u.life<=0){scene.remove(b);b.material.dispose();bits.splice(i,1);}}
 shake=Math.max(0,shake-dt);cam.position.x=shake?R(-1,1)*shake*.6:0;cam.position.y=shake?R(-1,1)*shake*.6:0;
 renderer.render(scene,cam);}
requestAnimationFrame(frame);
})();
</script></body></html>
